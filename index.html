<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Meta domain verification. Written directly into the template and not
      injected from React on purpose: Meta reads the HTML exactly as it
      arrives from the server and doesn't execute JavaScript, so a tag that
      only appeared on mount would never be seen. Prerendering starts from
      this same file, so the tag ends up on all seventeen routes without
      being repeated in any of them.

      The code is public —anyone can read it in the `<head>`— and grants no
      access to anything: it only proves to Meta that the domain is ours.
      That's why it's hardcoded rather than pulled from an environment
      variable, just like the pixel id: if it depended on a variable,
      forgetting it in Vercel would silently disable the ad account's
      permissions over the domain.
    -->
    <meta name="facebook-domain-verification" content="x7k57sl0qhqkbc1lyax1hvyisikx8i" />
    <title>Dexel | Automatización de procesos y software a la medida</title>
    <script>
      // Applies the theme before the first paint. Now that the HTML arrives
      // pre-rendered from the server, without this you'd see a flash of
      // light mode before React mounts and sets the class.
      (function () {
        try {
          var stored = localStorage.getItem("dexel_theme_preference");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* without localStorage the theme gets decided by React on mount */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dexel | Automatización de procesos y software a la medida</title>
    <script>
      // Aplica el tema antes del primer pintado. Ahora que el HTML llega
      // renderizado desde el servidor, sin esto se vería un destello claro
      // antes de que React monte y ponga la clase.
      (function () {
        try {
          var stored = localStorage.getItem("dexel_theme_preference");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* sin localStorage el tema lo decide React al montar */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
